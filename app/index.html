<!DOCTYPE html>
<html lang="en">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Movie Search App</title>
  
  <meta property="og:title" content="Movie Search App">
  <meta property="og:description" content="Mag-search ng movie gamit ang real-time web app.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://JohnKesterBenitez.github.io/movie-app/"> <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <h1>🎬 Movie Finder</h1>
    
    <div class="search-box">
      <input type="text" id="movie-input" placeholder="Enter movie title...">
      <button id="search-btn">Search</button>
    </div>

    <div id="result-container" class="result-container">
      <p class="placeholder-text">Search for movie details.</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
